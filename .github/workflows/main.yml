# Builds Code Quest for Linux and Windows on GitHub's own machines.
# Runs on every push to main, on pull requests, and by hand
# (Actions tab -> "Build" -> "Run workflow").
# Pushing a tag like v0.2.0 also creates a GitHub Release with the files attached.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # Older Ubuntu = older glibc, so the program runs on more Linux PCs
            os: ubuntu-22.04
            binary: code-quest
          - name: windows
            os: windows-latest
            binary: code-quest.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages (WebKitGTK)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # Windows builds need an .ico icon. If the repo has none, make one from icon.png.
      - name: Make Windows icon
        if: matrix.name == 'windows'
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/icon.ico ]; then
            pip install pillow
            python - <<'EOF'
          import json
          from PIL import Image
          Image.open("src-tauri/icons/icon.png").save(
              "src-tauri/icons/icon.ico",
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          if "icons/icon.ico" not in c["bundle"]["icon"]:
              c["bundle"]["icon"].append("icons/icon.ico")
          json.dump(c, open(p, "w"), indent=2)
          EOF
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Upload program
        uses: actions/upload-artifact@v4
        with:
          name: code-quest-${{ matrix.name }}
          path: src-tauri/target/release/${{ matrix.binary }}
          if-no-files-found: error

      - name: Rename for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp src-tauri/target/release/code-quest.exe dist/code-quest-windows.exe
          else
            cp src-tauri/target/release/code-quest dist/code-quest-linux
          fi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
